[project]
name = "concert-alerts"
dynamic = ["version"]
description = "Alerts when artists in your music library announce concerts in your country (Ticketmaster, Resident Advisor, DICE)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]

[project.scripts]
concert-alerts = "concert_alerts.__main__:main"

[project.urls]
Repository = "https://github.com/mateo19182/concert-alerts"

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "concert_alerts/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["concert_alerts", "tests", "examples", "deploy", "README.md", "THIRD_PARTY_NOTICES"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
